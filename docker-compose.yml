services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semana_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-semana_ingenieria}
      DB_USERNAME: ${DB_USERNAME:-semana_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - semana_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: semana_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - semana_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: semana_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-semana_ingenieria}
      MYSQL_USER: ${DB_USERNAME:-semana_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - semana_db_data:/var/lib/mysql
    networks:
      - semana_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: semana_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - semana_net
    depends_on:
      - db

networks:
  semana_net:
    driver: bridge

volumes:
  semana_db_data:
    driver: local
